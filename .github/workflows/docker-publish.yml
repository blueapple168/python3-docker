name: Docker

on:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: blueapple/uos-python
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen_matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan all target directories
        id: scan_dirs
        run: |
          ALL_DIRS=$(find ./uos -maxdepth 1 -type d -name "python3.*" | sort)
          echo "ALL_DIRS<<EOF" >> $GITHUB_OUTPUT
          echo "${ALL_DIRS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Detected directories:"
          echo "${ALL_DIRS}"

      - name: Calculate changed directories
        id: gen_matrix
        env:
          ALL_DIRS: ${{ steps.scan_dirs.outputs.ALL_DIRS }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          ALL_DIRS="${ALL_DIRS}"
          EVENT="${EVENT}"
          REF_TYPE="${REF_TYPE}"

          if [[ "${EVENT}" == "schedule" || "${REF_TYPE}" == "tag" ]]; then
            TARGETS="${ALL_DIRS}"
          else
            if [[ "${EVENT}" == "pull_request" ]]; then
              DIFF_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
            else
              if [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
                DIFF_FILES=$(git ls-files)
              else
                DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
              fi
            fi

            echo "==== Changed files ===="
            echo "${DIFF_FILES}"

            TARGETS=""
            while IFS= read -r dir; do
              PREFIX="${dir}/"
              if echo "${DIFF_FILES}" | grep -q "${PREFIX}"; then
                TARGETS+="${dir}"$'\n'
              fi
            done <<< "${ALL_DIRS}"
          fi

          TARGETS=$(echo "${TARGETS}" | sed '/^\s*$/d')
          if [[ -z "${TARGETS}" ]]; then
            MATRIX='{"context_dir":["__SKIP__"]}'
          else
            MATRIX=$(echo "${TARGETS}" | jq -R . | jq -s '{"context_dir":.}')
          fi
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Final build matrix: ${MATRIX}"

  build:
    needs: discovery
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discovery.outputs.matrix) }}
    steps:
      # 【关键】占位判断放在最顶部，优先执行，短路后续所有步骤
      - name: Skip empty build placeholder
        if: matrix.context_dir == '__SKIP__'
        run: |
          echo "✅ No directories modified, skip all build steps"
          exit 0

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context_dir }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:buildcache,mode=max

      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          TAG_LIST: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          FIRST_TAG=$(echo "${TAG_LIST}" | cut -d',' -f1)
          FULL_IMAGE_TAG="${REGISTRY}/${IMAGE_REPO}:${FIRST_TAG#*:}"
          cosign sign --yes "${FULL_IMAGE_TAG}@${DIGEST}"
