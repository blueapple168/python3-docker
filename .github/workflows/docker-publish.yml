name: Docker

on:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: blueapple/uos-python
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      matrix_data: ${{ steps.gen_matrix.outputs.matrix_data }}
      has_work: ${{ steps.gen_matrix.outputs.has_work }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45

      - name: Scan all python版本目录
        id: scan_dirs
        run: |
          ALL_DIRS=$(find ./uos -maxdepth 1 -type d -name "python3.*" | sort)
          echo "ALL_DIRS<<EOF" >> $GITHUB_OUTPUT
          echo "${ALL_DIRS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "原始扫描目录："
          echo "${ALL_DIRS}"

      - name: Match changed directories
        id: gen_matrix
        env:
          ALL_DIRS: ${{ steps.scan_dirs.outputs.ALL_DIRS }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          ALL_DIRS="${ALL_DIRS}"
          EVENT="${EVENT}"
          REF_TYPE="${REF_TYPE}"
          TARGETS=""

          if [[ "${EVENT}" == "schedule" || "${REF_TYPE}" == "tag" ]]; then
            TARGETS="${ALL_DIRS}"
          else
            echo "==== 变更文件列表 ===="
            echo "${CHANGED_FILES}"
            echo "======================"
            # 进程替换，规避子shell变量丢失问题
            while IFS= read -r dir; do
              [[ -z "${dir}" ]] && continue
              clean_dir="${dir#./}"
              echo "校验目录：${dir} → 清理前缀：${clean_dir}"
              while IFS= read -r file; do
                [[ -z "${file}" ]] && continue
                if [[ "${file}" == "${clean_dir}/"* ]]; then
                  echo "✅ 文件匹配：${file} → ${dir}"
                  TARGETS+="${dir}"$'\n'
                  break
                fi
              done < <(echo "${CHANGED_FILES}")
            done < <(echo "${ALL_DIRS}")
          fi

          TARGETS=$(echo "${TARGETS}" | sort -u | sed '/^\s*$/d')
          if [[ -z "${TARGETS}" ]]; then
            MATRIX='{"context_dir":[]}'
            HAS_WORK="false"
          else
            MATRIX=$(echo "${TARGETS}" | jq -R . | jq -s '{"context_dir":.}')
            HAS_WORK="true"
          fi
          echo "matrix_data=${MATRIX}" >> $GITHUB_OUTPUT
          echo "has_work=${HAS_WORK}" >> $GITHUB_OUTPUT
          echo "最终矩阵：${MATRIX}"
          echo "是否需要构建：${HAS_WORK}"

  build:
    needs: discovery
    if: ${{ needs.discovery.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discovery.outputs.matrix_data) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context_dir }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:buildcache,mode=max

      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          TAG_LIST: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          FIRST_TAG=$(echo "${TAG_LIST}" | cut -d',' -f1)
          FULL_IMAGE_TAG="${REGISTRY}/${IMAGE_REPO}:${FIRST_TAG#*:}"
          cosign sign --yes "${FULL_IMAGE_TAG}@${DIGEST}"
